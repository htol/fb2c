run:
  timeout: 5m
  tests: true

issues:
  exclude-rules:
    # Tests legitimately repeat fixture strings and grow assertion-heavy;
    # goconst/gocyclo noise there hides real findings in production code.
    - path: _test\.go
      linters:
        - goconst
        - gocyclo

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - typecheck
    - gofmt
    - goimports
    - misspell
    - revive
    - bodyclose
    - dogsled
    - dupl
    - goconst
    - gocyclo
    - gosec

linters-settings:
  govet:
    shadow: true
  gocyclo:
    min-complexity: 15
  maligned:
    suggest-new: true
  dupl:
    threshold: 100
  goconst:
    min-len: 2
    min-occurrences: 2
  misspell:
    locale: US
    ignore-words:
      - calibre
      - Calibre
  llll:
    line-length: 140
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - wrapperFunc
      - dupImport # https://github.com/go-critic/go-critic/issues/845
      - ifElseChain
      - octalLiteral
      - whyNoLint
